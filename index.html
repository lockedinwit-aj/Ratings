
<section id="customer-reviews">
  <h2>Customer Reviews</h2>
  <p>Share Your Experience With Wood Work With AJ</p>

  <form id="reviewForm">
    <label for="rating">Rate Your Experience</label>
    <select id="rating" required>
      <option value="">Choose A Rating</option>
      <option value="5">★★★★★ - 5 Stars</option>
      <option value="4">★★★★☆ - 4 Stars</option>
      <option value="3">★★★☆☆ - 3 Stars</option>
      <option value="2">★★☆☆☆ - 2 Stars</option>
      <option value="1">★☆☆☆☆ - 1 Star</option>
    </select>

    <label for="reviewName">Your Name</label>
    <input
      id="reviewName"
      type="text"
      maxlength="60"
      required
    />

    <label for="reviewText">Your Review</label>
    <textarea
      id="reviewText"
      maxlength="1000"
      required
    ></textarea>

    <!-- Cloudflare Spam Protection -->
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAFXvpgsLMitWlafL">
    </div>

    <button type="submit">Submit Review</button>
    <p id="reviewStatus" role="status"></p>
  </form>
</section>

<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"
  async
  defer>
</script>

<script>
document.getElementById("reviewForm")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const status = document.getElementById("reviewStatus");
    const token = document.querySelector(
      '[name="cf-turnstile-response"]'
    )?.value;

    if (!token) {
      status.textContent = "Complete The Security Check.";
      return;
    }

    const review = {
      name: document.getElementById("reviewName").value,
      rating: Number(document.getElementById("rating").value),
      text: document.getElementById("reviewText").value,
      turnstileToken: token
    };

    try {
      const response = await fetch(
        "/.netlify/functions/reviews",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(review)
        }
      );

      if (!response.ok) {
        throw new Error("Review Submission Failed");
      }

      status.textContent = "Review Submitted Successfully!";
      document.getElementById("reviewForm").reset();
      window.turnstile?.reset();
    } catch (error) {
      status.textContent = "Unable To Submit Review.";
      window.turnstile?.reset();
    }
  });
</script>
